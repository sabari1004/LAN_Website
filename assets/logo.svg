<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40" fill="none">
  <defs>
    <linearGradient id="lanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Shield/Rounded Box -->
  <rect x="2" y="2" width="36" height="36" rx="10" fill="#0F172A" stroke="#1E293B" stroke-width="1.5"/>
  <!-- Glowing Network Nodes & Interconnects -->
  <path d="M12 28V12L20 20L28 12V28" stroke="url(#lanGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <!-- Central Connectivity Dot -->
  <circle cx="20" cy="20" r="3" fill="#38BDF8" />
  <circle cx="12" cy="12" r="2" fill="#38BDF8" />
  <circle cx="28" cy="12" r="2" fill="#38BDF8" />
  <circle cx="12" cy="28" r="2" fill="#0284C7" />
  <circle cx="28" cy="28" r="2" fill="#0284C7" />
</svg>
